<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SSMA Plus</title>
  <!-- Global builds: Vue 3, Vue Router 4, js-md5 (all in head) -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ========== CSS VARIABLES (Soft Gradient / Light Theme) ========== */
    :root {
      --bg: #f9fafc;
      --surface: #ffffff;
      --surface-secondary: #f1f4f9;
      --text-primary: #0b1e33;
      --text-secondary: #5a6e85;
      --text-muted: #8b9eb2;
      --accent: #4a7cff;
      --accent-soft: #eef3ff;
      --accent-gradient: linear-gradient(145deg, #5b8cff, #3d6eff);
      --success: #2e8b57;
      --danger: #c44545;
      --warning: #d97c2b;
      --border-light: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(0, 20, 40, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 20, 40, 0.06);
      --radius-card: 20px;
      --radius-btn: 14px;
      --radius-input: 12px;
      --space-xs: 6px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --tab-height: 62px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      color: var(--text-primary);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    /* ----- Page container (scrollable) ----- */
    .page-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: var(--space-md);
      padding-top: calc(var(--space-md) + var(--safe-top));
      padding-bottom: 8px;
    }

    /* ----- Tab bar (fixed bottom) ----- */
    .tab-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--surface);
      border-top: 1px solid var(--border-light);
      padding: 4px 0 calc(4px + var(--safe-bottom));
      height: calc(var(--tab-height) + var(--safe-bottom));
      flex-shrink: 0;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.02);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 44px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      transition: color 0.15s;
      gap: 2px;
      border: none;
      background: none;
      cursor: pointer;
    }

    .tab-item.active {
      color: var(--accent);
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }

    /* ----- Cards & general ----- */
    .card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: var(--space-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: var(--space-md);
      border: 1px solid rgba(226, 232, 240, 0.5);
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .page-sub {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    /* ----- Button ----- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: var(--radius-btn);
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      background: var(--accent-gradient);
      color: #fff;
      width: 100%;
    }
    .btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* ----- Form inputs ----- */
    .input-field {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: var(--radius-input);
      border: 1.5px solid var(--border-light);
      font-size: 15px;
      background: var(--surface);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: var(--space-sm);
    }
    .input-field:focus {
      border-color: var(--accent);
    }
    textarea.input-field {
      min-height: 100px;
      resize: vertical;
    }

    /* ----- Stock list ----- */
    .stock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
      min-height: 56px;
      cursor: pointer;
    }
    .stock-row:last-child {
      border-bottom: none;
    }
    .stock-symbol {
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
    }
    .stock-name {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .stock-price {
      font-weight: 600;
      font-size: 16px;
      text-align: right;
    }
    .stock-change {
      font-size: 13px;
      font-weight: 600;
      text-align: right;
      margin-top: 2px;
    }
    .up { color: var(--success); }
    .down { color: var(--danger); }

    /* ----- Quick actions grid ----- */
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: var(--space-md);
    }
    .quick-item {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(226, 232, 240, 0.5);
      text-decoration: none;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      min-height: 92px;
      transition: background 0.1s;
    }
    .quick-item:active {
      background: var(--surface-secondary);
    }
    .quick-item svg {
      width: 28px;
      height: 28px;
      stroke: var(--accent);
      stroke-width: 1.8;
      fill: none;
    }

    /* ----- Toolbox tools ----- */
    .tool-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tool-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: 14px 16px;
      border: 1px solid rgba(226, 232, 240, 0.5);
      min-height: 64px;
      text-decoration: none;
      color: var(--text-primary);
    }
    .tool-icon {
      width: 42px;
      height: 42px;
      background: var(--accent-soft);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tool-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--accent);
      stroke-width: 1.8;
      fill: none;
    }
    .tool-name {
      font-weight: 600;
      font-size: 16px;
    }
    .tool-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* ----- Settings rows ----- */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      text-decoration: none;
      color: var(--text-primary);
    }
    .setting-row:last-child {
      border-bottom: none;
    }
    .setting-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
      font-size: 15px;
    }
    .setting-label svg {
      width: 20px;
      height: 20px;
      stroke: var(--accent);
      stroke-width: 1.8;
      fill: none;
    }
    .setting-value {
      color: var(--text-muted);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .chevron {
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1;
    }

    /* ----- Calendar (check-in) ----- */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 12px;
    }
    .calendar-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--surface-secondary);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .calendar-cell.checked {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .calendar-cell.empty {
      background: transparent;
    }

    /* ----- Modal / Overlay ----- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 999;
    }
    .modal-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: 24px;
      max-width: 400px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .modal-body {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    /* ----- Toast ----- */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 14px;
      z-index: 1000;
      white-space: nowrap;
      pointer-events: none;
      animation: fadeInUp 0.2s;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ----- Loading page ----- */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 20px;
      padding: 40px;
      text-align: center;
    }
    .loading-logo {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ----- Utility ----- */
    .text-muted { color: var(--text-muted); }
    .text-sm { font-size: 13px; }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .hash-box {
      background: var(--surface-secondary);
      border-radius: var(--radius-input);
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
      color: var(--text-primary);
      margin: 8px 0;
      border: 1px solid var(--border-light);
    }

    /* transition */
    .fade-enter-active, .fade-leave-active {
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .fade-enter-from {
      opacity: 0;
      transform: translateY(6px);
    }
    .fade-leave-to {
      opacity: 0;
      transform: translateY(-6px);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Loading screen (shown while checking privacy) -->
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>

    <!-- Tab bar - only for Home / Toolbox / Settings -->
    <nav class="tab-bar" v-if="showTabBar">
      <router-link to="/home" class="tab-item" active-class="active">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span>Home</span>
      </router-link>
      <router-link to="/toolbox" class="tab-item" active-class="active">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
        <span>Toolbox</span>
      </router-link>
      <router-link to="/settings" class="tab-item" active-class="active">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04a1.65 1.65 0 0 0 1.51 1h12.7a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0 .33-1.82z" />
          <path d="M19.4 9a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04a1.65 1.65 0 0 0 1.51 1h12.7a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0 .33-1.82z" />
        </svg>
        <span>Settings</span>
      </router-link>
    </nav>
  </div>

  <script>
    /*
     * HOW TO ADD A NEW PAGE:
     * 1. Add a new route to the `routes` array (path + component).
     * 2. Define the component (template + setup) above the routes.
     * 3. If it's a main tab, add a <router-link> to the .tab-bar in the HTML,
     *    and update the `showTabBar` computed to include the new path.
     */

    (function () {
      const { createApp, ref, computed, onMounted, reactive } = Vue;
      const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

      /* ============================================================
       *  INLINE SVG ICONS (as string templates for reuse)
       * ============================================================ */
      const Icons = {
        home: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
        toolbox: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`,
        settings: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04a1.65 1.65 0 0 0 1.51 1h12.7a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0 .33-1.82z"/><path d="M19.4 9a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04a1.65 1.65 0 0 0 1.51 1h12.7a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0 .33-1.82z"/></svg>`,
        chart: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
        trendUp: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
        trendDown: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>`,
        star: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
        book: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
        calculator: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11"/><line x1="12" y1="11" x2="12" y2="11"/><line x1="16" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="8" y2="15"/><line x1="12" y1="15" x2="12" y2="15"/><line x1="16" y1="15" x2="16" y2="15"/><line x1="8" y1="19" x2="16" y2="19"/></svg>`,
        calendar: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
        coin: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 9h6.5a2.5 2.5 0 0 1 0 5H9"/></svg>`,
        lock: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
        note: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
        envelope: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,6 12,13 2,6"/></svg>`,
        user: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
        shield: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
        document: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
        inbox: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
        check: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polyline points="20 6 9 17 4 12"/></svg>`,
        refresh: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`
      };

      /* ============================================================
       *  STOCK DATA (built-in, 20+ items)
       * ============================================================ */
      const STOCK_POOL = [
        { symbol: 'AAPL', name: 'Apple Inc.', price: 178.35, change: 2.34 },
        { symbol: 'MSFT', name: 'Microsoft Corp.', price: 412.20, change: -1.05 },
        { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 156.80, change: 1.78 },
        { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 182.45, change: 0.92 },

            <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
              <button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
              <div class="page-title" style="margin-bottom:0;">Profit Calculator</div>
            </div>
            <div class="card">
              <label class="text-sm text-muted">Unit Cost ($)</label>
              <input class="input-field" type="number" v-model.number="cost" step="0.01">
              <label class="text-sm text-muted">Selling Price ($)</label>
              <input class="input-field" type="number" v-model.number="price" step="0.01">
              <label class="text-sm text-muted">Quantity</label>
              <input class="input-field" type="number" v-model.number="qty" step="1">
              <div class="hash-box" style="margin-top:16px;">
                Revenue: \${{ revenue.toFixed(2) }}<br>
                Profit: <span :class="profit >= 0 ? 'up' : 'down'">\${{ profit.toFixed(2) }}</span><br>
                Margin: {{ margin.toFixed(1) }}%
              </div>
            </div>
          </div>
        `,
        setup() {
          const cost = ref(12);
          const price = ref(20);
          const qty = ref(50);
          const revenue = computed(() => price.value * qty.value);
          const profit = computed(() => (price.value - cost.value) * qty.value);
          const margin = computed(() => revenue.value ? (profit.value / revenue.value) * 100 : 0);
          return { cost, price, qty, revenue, profit, margin };
        }
      };

      // --- Tool: Reverse Yield ---
      const ReverseYieldTool = {
        name: 'ReverseYieldTool',
        template: `
          <div class="page-container">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
              <button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
              <div class="page-title" style="margin-bottom:0;">Reverse Yield</div>
            </div>
            <div class="card">
              <label class="text-sm text-muted">Target Profit ($)</label>
              <input class="input-field" type="number" v-model.number="target" step="100">
              <label class="text-sm text-muted">Principal ($)</label>
              <input class="input-field" type="number" v-model.number="principal" step="1000">
              <label class="text-sm text-muted">Investment Duration (years)</label>
              <input class="input-field" type="number" v-model.number="years" step="0.5">
              <div class="hash-box" style="margin-top:16px;">
                Required Annual Return: {{ requiredRate.toFixed(2) }}%
              </div>
            </div>
          </div>
        `,
        setup() {
          const target = ref(5000);
          const principal = ref(50000);
          const years = ref(3);
          const requiredRate = computed(() => {
            if (!principal.value || !years.value) return 0;
            return (Math.pow((principal.value + target.value) / principal.value, 1 / years.value) - 1) * 100;
          });
          return { target, principal, years, requiredRate };
        }
      };

      // --- Tool: Password Strength (with md5) ---
      const PasswordTool = {
        name: 'PasswordTool',
        template: `
          <div class="page-container">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
              <button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
              <div class="page-title" style="margin-bottom:0;">Password Strength</div>
            </div>
            <div class="card">
              <label class="text-sm text-muted">Enter Password</label>
              <input class="input-field" type="password" v-model="password" placeholder="Type a password">
              <div class="hash-box" style="margin-top:12px;">
                Strength: <strong :style="{ color: strengthColor }">{{ strengthLabel }}</strong><br>
                MD5: <span style="word-break:break-all;">{{ md5Hash }}</span>
              </div>
              <div class="text-sm text-muted mt-2">Offline security rules applied locally.</div>
            </div>
          </div>
        `,
        setup() {
          const password = ref('');
          const md5Hash = computed(() => {
            if (!password.value) return '—';
            try { return md5(password.value); } catch(e) { return '—'; }
          });
          const strength = computed(() => {
            const p = password.value;
            let s = 0;
            if (p.length >= 8) s++;
            if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
            if (/\d/.test(p)) s++;
            if (/[^a-zA-Z0-9]/.test(p)) s++;
            return s;
          });
          const strengthLabel = computed(() => ['Very Weak','Weak','Fair','Strong','Very Strong'][strength.value] || 'Very Weak');
          const strengthColor = computed(() => ['#c44545','#d97c2b','#d9b62b','#2e8b57','#1e7a4a'][strength.value] || '#c44545');
          return { password, md5Hash, strength, strengthLabel, strengthColor };
        }
      };

      // --- Tool: Credit Memo ---
      const CreditMemoTool = {
        name: 'CreditMemoTool',
        template: `
          <div class="page-container">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
              <button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
              <div class="page-title" style="margin-bottom:0;">Credit Memo</div>
            </div>
            <div class="card">
              <input class="input-field" placeholder="Debtor name" v-model="debtor">
              <input class="input-field" type="number" placeholder="Amount ($)" v-model.number="amount">
              <input class="input-field" type="date" v-model="dueDate">
              <button class="btn" @click="addMemo" :disabled="!debtor || !amount || !dueDate">Add Memo</button>
              <div v-for="(m,i) in memos" :key="i" class="hash-box" style="margin-top:12px;">
                <strong>{{ m.debtor }}</strong> — \${{ m.amount }}<br>
                Due: {{ m.dueDate }}<br>
                <span :class="m.daysLeft <= 0 ? 'down' : ''">{{ m.daysLeft <= 0 ? 'Overdue' : m.daysLeft + ' days left' }}</span>
              </div>
            </div>
          </div>
        `,
        setup() {
          const debtor = ref('');
          const amount = ref(null);
          const dueDate = ref('');
          const memos = ref([]);
          const addMemo = () => {
            if (debtor.value && amount.value && dueDate.value) {
              const due = new Date(dueDate.value);
              const today = new Date();
              today.setHours(0,0,0,0);
              const daysLeft = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
              memos.value.push({ debtor: debtor.value, amount: amount.value, dueDate: dueDate.value, daysLeft });
              debtor.value = '';
              amount.value = null;
              dueDate.value = '';
            }
          };
          return { debtor, amount, dueDate, memos, addMemo };
        }
      };

      /* ============================================================
       *  SETTINGS PAGE (and its sub-pages)
       * ============================================================ */
      const SettingsPage = {
        name: 'SettingsPage',
        template: `
          <div class="page-container">
            <div class="page-title">Settings</div>
            <div class="page-sub">App preferences & information</div>

            <div class="card" style="padding: 4px 16px;">
              <router-link to="/settings/version" class="setting-row">
                <div class="setting-label"><span v-html="icons.document"></span> Version</div>
                <div class="setting-value">1.0.0 <span class="chevron">›</span></div>
              </router-link>
              <router-link to="/settings/privacy" class="setting-row">
                <div class="setting-label"><span v-html="icons.shield"></span> Privacy Policy</div>
                <div class="setting-value"><span class="chevron">›</span></div>
              </router-link>
              <router-link to="/settings/terms" class="setting-row">
                <div class="setting-label"><span v-html="icons.document"></span> Terms of Service</div>
                <div class="setting-value"><span class="chevron">›</span></div>
              </router-link>
              <router-link to="/settings/team" class="setting-row">
                <div class="setting-label"><span v-html="icons.user"></span> About Team</div>
                <div class="setting-value"><span class="chevron">›</span></div>
              </router-link>
              <a href="mailto:com.gravitex.voidshift@gmail.com" class="setting-row">
                <div class="setting-label"><span v-html="icons.envelope"></span> Contact Us</div>
                <div class="setting-value"><span class="chevron">›</span></div>
              </a>
              <router-link to="/settings/checkin" class="setting-row">
                <div class="setting-label"><span v-html="icons.check"></span> Monthly Check-in</div>
                <div class="setting-value"><span class="chevron">›</span></div>
              </router-link>
              <router-link to="/settings/feedback" class="setting-row">
                <div class="setting-label"><span v-html="icons.note"></span> Feedback</div>
                <div class="setting-value"><span class="chevron">›</span></div>
              </router-link>
              <router-link to="/settings/inbox" class="setting-row">
                <div class="setting-label"><span v-html="icons.inbox"></span> Inbox</div>
                <div class="setting-value"><span class="chevron">›</span></div>
              </router-link>
            </div>
          </div>
        `,
        setup() {
          return { icons: Icons };
        }
      };

      // Sub-pages
      const VersionPage = {
        template: `<div class="page-container"><div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;"><button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button><div class="page-title" style="margin-bottom:0;">Version</div></div><div class="card"><div style="font-size:20px; font-weight:600; margin-bottom:8px;">SSMA Plus</div><div class="text-muted">Version 1.0.0</div><div class="text-muted text-sm mt-2">Build 20250326</div></div></div>`
      };

      const PrivacyPage = {
        template: `<div class="page-container"><div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;"><button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button><div class="page-title" style="margin-bottom:0;">Privacy Policy</div></div><div class="card"><div style="line-height:1.7; color:var(--text-secondary); font-size:15px;">We respect your privacy. This application does not collect personal data without consent. All calculations and data storage happen locally on your device. No information is transmitted to external servers except for the privacy check request that determines whether a privacy policy page is available. For questions, contact us at com.gravitex.voidshift@gmail.com.</div></div></div>`
      };

      const TermsPage = {
        template: `<div class="page-container"><div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;"><button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button><div class="page-title" style="margin-bottom:0;">Terms of Service</div></div><div class="card"><div style="line-height:1.7; color:var(--text-secondary); font-size:15px;">By using SSMA Plus, you agree to use the app for informational purposes only. The developers are not responsible for any financial decisions made based on the app's calculations. All tools are provided as-is without warranty. This app is intended for educational and personal use.</div></div></div>`
      };

      const TeamPage = {
        template: `<div class="page-container"><div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;"><button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button><div class="page-title" style="margin-bottom:0;">About Team</div></div><div class="card"><div style="font-size:16px; font-weight:600; margin-bottom:8px;">Gravitex Labs</div><div style="color:var(--text-secondary); line-height:1.7; font-size:15px;">We are a small team of engineers and finance enthusiasts building practical tools for everyday investors. SSMA Plus is our flagship mobile companion, designed to be fast, private, and useful. Reach us anytime at com.gravitex.voidshift@gmail.com.</div></div></div>`
      };

      const CheckinPage = {
        template: `
          <div class="page-container">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
              <button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
              <div class="page-title" style="margin-bottom:0;">Monthly Check-in</div>
            </div>
            <div class="card">
              <div class="flex-between" style="margin-bottom:12px;">
                <span style="font-weight:600;">{{ monthLabel }}</span>
                <button class="btn" style="width:auto; padding:8px 18px; min-height:40px;" @click="doCheckin" :disabled="checkedToday">Check In</button>
              </div>
              <div class="calendar-grid">
                <div v-for="d in days" :key="d.key" class="calendar-cell" :class="{ checked: d.checked, empty: !d.day }">{{ d.day || '' }}</div>
              </div>
              <div v-if="checkedToday" class="text-sm text-muted mt-2">You've checked in today.</div>
            </div>
          </div>
        `,
        setup() {
          const now = new Date();
          const year = now.getFullYear();
          const month = now.getMonth();
          const monthLabel = new Date(year, month).toLocaleString('en', { month: 'long', year: 'numeric' });
          const today = now.getDate();
          const checkedDays = ref(JSON.parse(localStorage.getItem('checkins') || '{}'));
          const checkedToday = computed(() => checkedDays.value[`${year}-${month}-${today}`] === true);
          const days = computed(() => {
            const first = new Date(year, month, 1).getDay();
            const total = new Date(year, month + 1, 0).getDate();
            const arr = [];
            for (let i = 0; i < first; i++) arr.push({ key: 'e' + i, day: null, checked: false });
            for (let d = 1; d <= total; d++) {
              const key = `${year}-${month}-${d}`;
              arr.push({ key, day: d, checked: !!checkedDays.value[key] });
            }
            return arr;
          });
          const doCheckin = () => {
            if (!checkedToday.value) {
              checkedDays.value[`${year}-${month}-${today}`] = true;
              localStorage.setItem('checkins', JSON.stringify(checkedDays.value));
              // trigger toast (optional)
            }
          };
          return { monthLabel, days, checkedToday, doCheckin };
        }
      };

      const FeedbackPage = {
        template: `
          <div class="page-container">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
              <button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
              <div class="page-title" style="margin-bottom:0;">Feedback</div>
            </div>
            <div class="card">
              <input class="input-field" placeholder="Title" v-model="title">
              <textarea class="input-field" placeholder="Describe your feedback..." v-model="content"></textarea>
              <button class="btn" :disabled="!title || !content" @click="sendFeedback">Send</button>
              <div v-if="sent" class="text-sm mt-2" style="color:var(--success);">Thank you! Your feedback has been sent.</div>
            </div>
          </div>
        `,
        setup() {
          const title = ref('');
          const content = ref('');
          const sent = ref(false);
          const sendFeedback = () => {
            if (title.value && content.value) {
              sent.value = true;
              title.value = '';
              content.value = '';
              setTimeout(() => { sent.value = false; }, 2000);
            }
          };
          return { title, content, sent, sendFeedback };
        }
      };

      const InboxPage = {
        template: `
          <div class="page-container">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
              <button @click="$router.back()" style="background:none; border:none; min-height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
              <div class="page-title" style="margin-bottom:0;">Inbox</div>
            </div>
            <div class="card" style="padding:8px 16px;">
              <div v-for="msg in messages" :key="msg.id" class="setting-row" @click="openMessage(msg)">
                <div class="setting-label">{{ msg.title }}</div>
                <div class="setting-value"><span class="chevron">›</span></div>
              </div>
            </div>
            <div v-if="selected" class="modal-overlay" @click.self="selected = null">
              <div class="modal-card">
                <div class="modal-title">{{ selected.title }}</div>
                <div class="modal-body">{{ selected.body }}</div>
                <button class="btn" @click="selected = null">Close</button>
              </div>
            </div>
          </div>
        `,
        setup() {
          const messages = ref([
            { id: 1, title: 'Welcome to SSMA Plus', body: 'Thank you for using SSMA Plus. Explore our market data, toolbox, and settings to get started. We hope this app helps you make informed decisions.' }
          ]);
          const selected = ref(null);
          const openMessage = (msg) => { selected.value = msg; };
          return { messages, selected, openMessage };
        }
      };

      /* ============================================================
       *  ROUTER CONFIGURATION
       * ============================================================ */
      const routes = [
        { path: '/', redirect: '/loading' },
        { path: '/loading', component: LoadingPage },
        { path: '/home', component: HomePage },
        { path: '/home/top-gainers', component: StockListPage, props: true },
        { path: '/home/top-losers', component: StockListPage },
        { path: '/home/most-active', component: StockListPage },
        { path: '/home/potential', component: StockListPage },
        { path: '/home/todays-picks', component: StockListPage },
        { path: '/home/guide', component: GuidePage },
        { path: '/home/not-recommended', component: StockListPage },
        { path: '/home/watchlist', component: StockListPage },
        { path: '/home/stock/:symbol', component: StockDetailPage },
        { path: '/toolbox', component: ToolboxPage },
        { path: '/toolbox/dca', component: DcaTool },
        { path: '/toolbox/calendar', component: WealthCalendarTool },
        { path: '/toolbox/loan', component: LoanTool },
        { path: '/toolbox/profit', component: ProfitTool },
        { path: '/toolbox/reverse', component: ReverseYieldTool },
        { path: '/toolbox/password', component: PasswordTool },
        { path: '/toolbox/credit', component: CreditMemoTool },
        { path: '/settings', component: SettingsPage },
        { path: '/settings/version', component: VersionPage },
        { path: '/settings/privacy', component: PrivacyPage },
        { path: '/settings/terms', component: TermsPage },
        { path: '/settings/team', component: TeamPage },
        { path: '/settings/checkin', component: CheckinPage },
        { path: '/settings/feedback', component: FeedbackPage },
        { path: '/settings/inbox', component: InboxPage },
        { path: '/:pathMatch(.*)*', redirect: '/home' }
      ];

      const router = createRouter({
        history: createWebHashHistory(),
        routes
      });

      /* ============================================================
       *  APP ROOT
       * ============================================================ */
      const app = createApp({
        setup() {
          const showTabBar = computed(() => {
            const p = router.currentRoute.value.path;
            return ['/home', '/toolbox', '/settings'].includes(p);
          });
          return { showTabBar };
        }
      });

      app.use(router);
      app.mount('#app');
    })();
  </script>
</body>
</html>
